<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeyBelt Documentation</title>
  <meta name="theme-color" content="#0D0D0D" />
  <link rel="icon" type="image/png" href="img/keybelt_ui_mark.png" />
  <link rel="shortcut icon" type="image/png" href="img/keybelt_ui_mark.png" />
  <link rel="apple-touch-icon" href="img/keybelt_ui_mark.png" />
  <script>
    /* Dark is the default. A saved choice wins. Storage can be blocked (file://, private mode). */
    (function () {
      var t = "dark";
      try { if (localStorage.getItem("kb-theme") === "light") t = "light"; } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="css/docs.css?v=c1dda877ad" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button type="button" id="menuToggle" class="icon-btn menu-toggle" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <a class="logo-link" href="#" aria-label="KeyBelt documentation home" style="display:flex">
        <span class="logo-h mask" id="logo" role="img" aria-label="KeyBelt"></span>
      </a>
      <div class="topbar-text">
        <p>Documentation</p>
        <span class="beta-tag">Public beta</span>
      </div>
      <div class="topbar-actions">
        <a href="../" class="kb-site-link">KeyBelt site</a>
        <input type="search" id="searchInput" class="search" placeholder="Search tools" aria-label="Search tools" autocomplete="off" />
        <button type="button" id="themeToggle" class="icon-btn theme-btn" aria-label="Switch between dark and light theme" title="Switch theme">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <div class="body">
      <aside id="sidebar" class="sidebar">
        <nav id="nav" class="nav" aria-label="Tools"></nav>
      </aside>
      <div id="overlay" class="overlay" hidden></div>
      <main id="content" class="content" tabindex="-1">
        <section class="welcome">
          <h2>Welcome</h2>
          <p>Pick a tool on the left to see what it does and how to use it.</p>
        </section>
      </main>
    </div>
  </div>

  <script src="js/categories.js?v=c1dda877ad"></script>
  <script src="js/figures.js?v=c1dda877ad"></script>
  <script src="js/content.js?v=c1dda877ad"></script>
  <script src="js/keys-playground.js?v=c1dda877ad"></script>
  <script src="js/ui-mocks.js?v=c1dda877ad"></script>
  <script src="js/app.js?v=c1dda877ad"></script>
</body>
</html>
